name: Refresh signed bridges

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-bridge-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Collect and validate public bridge candidates
        run: |
          set -euo pipefail
          python3 tools/collect_bridges.py
          python3 - <<'PY'
          import datetime
          import json
          from tools.collect_bridges import canonical_bridge
          document = json.load(open('packaging/bridges.json'))
          assert document['schema'] == 1
          assert 0 < document['expires_at'] - document['issued_at'] <= 36 * 3600
          assert 1 <= len(document['bridges']) <= 200
          assert len(set(document['bridges'])) == len(document['bridges'])
          assert all(canonical_bridge(line) == line for line in document['bridges'])
          assert sum(line.startswith('obfs4 ') for line in document['bridges']) <= 60
          assert sum(line.startswith('webtunnel ') for line in document['bridges']) <= 20
          PY
      - name: Sign and verify exact feed bytes
        env:
          GOZAR_BRIDGE_KEY: ${{ secrets.GOZAR_BRIDGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GOZAR_BRIDGE_KEY"
          umask 077
          key="$RUNNER_TEMP/gozar-bridge-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$GOZAR_BRIDGE_KEY" > "$key"
          GOZAR_BRIDGE_KEY_FILE="$key" bash tools/sign_bridges.sh
          bash tools/verify_bridges.sh
      - name: Publish only the signed feed to bridge-feed
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/bridge-feed"
          if git ls-remote --exit-code origin refs/heads/bridge-feed >/dev/null 2>&1; then
            git fetch --depth=1 origin bridge-feed
            git worktree add --detach "$feed" FETCH_HEAD
            cd "$feed"
            git checkout -B bridge-feed
          else
            git worktree add --detach "$feed"
            cd "$feed"
            git checkout --orphan bridge-feed
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p packaging
          cp "$GITHUB_WORKSPACE/packaging/bridges.json" packaging/bridges.json
          cp "$GITHUB_WORKSPACE/packaging/bridges.json.sig" packaging/bridges.json.sig
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/bridges.json packaging/bridges.json.sig
          if git diff --cached --quiet; then
            echo 'Signed feed is unchanged'
          else
            git commit -m 'Refresh signed Tor bridge candidates'
            git push origin HEAD:refs/heads/bridge-feed
          fi
