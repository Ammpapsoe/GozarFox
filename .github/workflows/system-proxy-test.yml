name: System proxy focused tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-system-proxy:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test Windows proxy transactions, recovery and connection contract
        working-directory: go-desktop
        run: |
          go test ./internal/sysproxy -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/app ./internal/rpc -run '^(TestConnectionMode|TestSystemProxy)' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-race:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Race-test proxy transactions and connection lifecycle
        working-directory: go-desktop
        run: go test -race ./internal/sysproxy ./internal/localproxy ./internal/app ./internal/rpc -count=1
