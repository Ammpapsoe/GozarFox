name: Autonomous Android

on:
  push:
    branches: ['mission/autonomous-v1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin and Java
        run: bash scripts/run_gradle_ci.sh compile :app:compileDebugKotlin :app:compileDebugJavaWithJavac

  unit-tests:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run DNS, relay and application unit tests
        run: bash scripts/run_gradle_ci.sh unit :core:test :app:testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-unit-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  artifact:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble ABI-split debug APKs
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK package boundaries
        run: |
          set -euo pipefail
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/build/outputs/apk/debug/app-$abi-debug.apk"
            test -s "$apk"
            if unzip -Z1 "$apk" | grep -E '(^|/)(libtor|libgojni)\.so$|TorService|IPtProxy' >/dev/null; then
              echo '::error::Removed Tor components are still packaged'
              exit 1
            fi
            du -h "$apk"
          done
      - name: Upload tested debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
