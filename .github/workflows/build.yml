name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      validate_release:
        description: Build and verify release artifacts without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XIAOMI_APP_ID: ${{ secrets.XIAOMI_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Android security, tunnel and interface
        run: bash ./gradlew :core:test :app:testDebugUnitTest --no-daemon
      - name: Signing key
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify Android signing identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
        run: |
          set -e
          expected=bc9d3368f2671175f81be047a1ff72bca0cfc58e8b1b8f9f87e24694ba45f5b1
          for apk in app/build/outputs/apk/release/*.apk; do
            test -s "$apk"
            info=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$info" | grep -Fx 'Number of signers: 1' >/dev/null
            actual=$(printf '%s\n' "$info" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::Android signing certificate does not match the official Gozar key"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/release-manifest.txt"
            if grep -F 'RecoveryFixtureActivity' "$RUNNER_TEMP/release-manifest.txt" >/dev/null; then
              echo "::error::CI-only recovery fixture activity must never appear in a release APK"
              exit 1
            fi
          done
      - name: Collect APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            case "$b" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *) abi=universal ;;
            esac
            cp "$f" "out/Gozar_${VERSION}_${abi}.apk"
          done
      - name: Assemble debug build
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release)) }}
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release)) }}
        with:
          name: android-debug-not-release
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
        with:
          name: android
          path: out/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            name: Linux-amd64
          - os: windows-2022
            platform: windows
            arch: amd64
            name: Windows-x64
          - os: macos-15
            platform: darwin
            arch: arm64
            name: macOS-ARM
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: go-desktop/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Inspect Go code
        working-directory: go-desktop
        shell: bash
        run: go vet ./...
      - name: Test simulated core and device behavior
        working-directory: go-desktop
        shell: bash
        run: go test ./...
      - name: Stress loopback latency on the Windows clock
        if: matrix.platform == 'windows'
        working-directory: go-desktop
        shell: bash
        run: go test ./internal/tunnel -run '^TestLatencyMeasuresLocalListener$' -count=50
      - name: Compile live tunnel test
        working-directory: go-desktop
        shell: bash
        run: |
          set -e
          suffix=''
          if [ "${{ matrix.platform }}" = windows ]; then suffix='.exe'; fi
          go test -c -o "$RUNNER_TEMP/gozar-live-tun.test$suffix" ./internal/engine
      - name: Test the real Linux TUN in an isolated namespace
        if: matrix.platform == 'linux'
        shell: bash
        run: scripts/test_live_tun_linux.sh "$RUNNER_TEMP/gozar-live-tun.test"
      - name: Test the real Windows Wintun device
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          & "$env:RUNNER_TEMP/gozar-live-tun.test.exe" '-test.v' '-test.run=^TestLiveKernelTunnel$' '-test.timeout=75s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the real macOS utun device
        if: matrix.platform == 'darwin'
        shell: bash
        run: sudo env GOZAR_LIVE_TUN_TEST=1 GOZAR_LIVE_DNS_CHANGE_TEST=1 GOZAR_PROTECT_TEST_IP=203.0.113.42 "$RUNNER_TEMP/gozar-live-tun.test" -test.v '-test.run=^TestLiveKernelTunnel$' -test.timeout=75s
      - name: Compile live tunnel-to-proxy test
        working-directory: go-desktop
        shell: bash
        run: |
          set -e
          suffix=''
          if [ "${{ matrix.platform }}" = windows ]; then suffix='.exe'; fi
          go test -c -o "$RUNNER_TEMP/gozar-pipeline.test$suffix" ./internal/tunnel
      - name: Test Linux packets through a simulated HTTP2 proxy
        if: matrix.platform == 'linux'
        shell: bash
        run: scripts/test_live_tun_linux.sh "$RUNNER_TEMP/gozar-pipeline.test"
      - name: Test Windows packets through a simulated HTTP2 proxy
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          & "$env:RUNNER_TEMP/gozar-pipeline.test.exe" '-test.v' '-test.run=^TestLiveKernelTunnel$' '-test.timeout=90s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test macOS packets through a simulated HTTP2 proxy
        if: matrix.platform == 'darwin'
        shell: bash
        run: sudo env GOZAR_LIVE_TUN_TEST=1 GOZAR_PROTECT_TEST_IP=203.0.113.42 "$RUNNER_TEMP/gozar-pipeline.test" -test.v '-test.run=^TestLiveKernelTunnel$' -test.timeout=90s
      - name: Inspect Flutter code
        working-directory: desktop_flutter
        shell: bash
        run: |
          flutter pub get
          flutter analyze
      - name: Test interface only
        if: matrix.platform == 'linux'
        working-directory: desktop_flutter
        shell: bash
        run: flutter test --reporter expanded
      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: desktop_flutter
        shell: bash
        run: |
          set -e
          flutter build linux --release
          (cd ../go-desktop && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../desktop_flutter/build/linux/x64/release/bundle/gozar-core ./cmd/gozar)
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../QUIC-GO-LICENSE.txt ../QPACK-LICENSE.txt ../GO-DEPS-LICENSES.txt build/linux/x64/release/bundle/
          mkdir -p out
          XZ_OPT=-9 tar -C build/linux/x64/release -cJf out/Gozar-Linux-amd64.tar.xz bundle
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          (cd .. && scripts/package_deb.sh "$GITHUB_WORKSPACE/desktop_flutter/build/linux/x64/release/bundle" "$GITHUB_WORKSPACE/desktop_flutter/out/Gozar-Linux-amd64.deb" "$VERSION")
          ls -lh out/*
      - name: Install Windows installer tool
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $compiler)) { choco install nsis --no-progress -y }
          if (!(Test-Path $compiler)) { throw 'NSIS compiler was not installed' }
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: desktop_flutter
        shell: bash
        run: |
          set -e
          flutter build windows --release
          RUNNER=$(find build/windows -path '*/runner/Release/gozar.exe' -print -quit)
          test -n "$RUNNER"
          pwsh -NoProfile -File ../scripts/check-windows-manifest.ps1 -Exe "$RUNNER"
          FOLDER=$(dirname "$RUNNER")
          (cd ../go-desktop && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../desktop_flutter/$FOLDER/gozar-core.exe" ./cmd/gozar)
          mkdir -p "$RUNNER_TEMP/gozar-ipc"
          printf '%s\n' '{"id":1,"method":"state"}' '{"id":2,"method":"language","params":{"language":"en"}}' '{"id":3,"method":"quit"}' | APPDATA="$RUNNER_TEMP/gozar-ipc" "$FOLDER/gozar-core.exe" --rpc > "$RUNNER_TEMP/gozar-ipc.jsonl"
          python -c "import json,os; r=[json.loads(x) for x in open(os.path.join(os.environ['RUNNER_TEMP'],'gozar-ipc.jsonl'))]; assert [x['id'] for x in r]==[1,2,3] and r[1]['state']['language']=='en'"
          python -c "import pathlib,struct; p=pathlib.Path('$FOLDER/gozar-core.exe').read_bytes(); pe=struct.unpack_from('<I',p,60)[0]; assert p[pe:pe+4]==b'PE\0\0' and struct.unpack_from('<H',p,pe+24+68)[0]==2, 'The core must use the Windows GUI subsystem'"
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../QUIC-GO-LICENSE.txt ../QPACK-LICENSE.txt ../GO-DEPS-LICENSES.txt "$FOLDER/"
          mkdir -p out
          python ../scripts/archive_windows.py "$FOLDER" out/Gozar-Windows-x64.zip
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          COMPILER='/c/Program Files (x86)/NSIS/makensis.exe'
          "$COMPILER" -V2 \
            "-DSOURCE=$(cygpath -w "$PWD/$FOLDER")" \
            "-DOUTPUT=$(cygpath -w "$PWD/out/Gozar-Windows-x64-Setup.exe")" \
            "-DVERSION=$VERSION" \
            "-DLICENSE_FILE=$(cygpath -w "$PWD/../LICENSE")" \
            "-DICON_FILE=$(cygpath -w "$PWD/windows/runner/resources/app_icon.ico")" \
            "-DWIZARD_FILE=$(cygpath -w "$PWD/../packaging/windows/wizard.bmp")" \
            "-DHEADER_FILE=$(cygpath -w "$PWD/../packaging/windows/header.bmp")" \
            "$(cygpath -w "$PWD/../packaging/windows/gozar.nsi")"
          ls -lh out/*
      - name: Verify native Windows window with simulated core
        if: matrix.platform == 'windows'
        working-directory: desktop_flutter
        shell: pwsh
        run: |
          $runner = Get-ChildItem -Path build/windows -Filter gozar.exe -Recurse | Where-Object { $_.FullName -match '[\\/]runner[\\/]Release[\\/]' } | Select-Object -First 1
          if (!$runner) { throw 'Windows runner not found' }
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o "$env:RUNNER_TEMP/gozar-ui-test-core.exe" ../scripts/ui-smoke-core.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../scripts/test_windows_ui.ps1 -Bundle $runner.DirectoryName -Core "$env:RUNNER_TEMP/gozar-ui-test-core.exe" -TestLog "$env:RUNNER_TEMP/gozar-ui-test.log" -Screenshot "$env:RUNNER_TEMP/gozar-ui-simulated.png"
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows' && !startsWith(github.ref, 'refs/tags/v')
        with:
          name: gozar-windows-ui-simulated
          path: ${{ runner.temp }}/gozar-ui-simulated.png
          if-no-files-found: warn
      - name: Verify Windows installer and uninstaller
        if: matrix.platform == 'windows'
        working-directory: desktop_flutter
        shell: pwsh
        run: ../scripts/test_windows_installer.ps1 -Installer out/Gozar-Windows-x64-Setup.exe -InstallDir "$env:RUNNER_TEMP/gozar-install-smoke"
      - name: Build macOS
        if: matrix.platform == 'darwin'
        working-directory: desktop_flutter
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ matrix.name }}
        run: |
          set -e
          flutter build macos --release
          APP=build/macos/Build/Products/Release/Gozar.app
          test -d "$APP"
          case "$GOARCH" in
            amd64) ARCH=x86_64 ;;
            arm64) ARCH=arm64 ;;
            *) echo "Unsupported macOS architecture"; exit 1 ;;
          esac
          thin_binary() {
            binary="$1"
            test -f "$binary"
            if [ "$(lipo -archs "$binary")" != "$ARCH" ]; then
              lipo "$binary" -thin "$ARCH" -output "$binary.thin"
              chmod 755 "$binary.thin"
              mv "$binary.thin" "$binary"
            fi
            test "$(lipo -archs "$binary")" = "$ARCH"
          }
          thin_binary "$APP/Contents/MacOS/Gozar"
          while IFS= read -r -d '' framework; do
            name=$(basename "$framework" .framework)
            thin_binary "$framework/Versions/A/$name"
          done < <(find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -type d -name '*.framework' -print0)
          (cd ../go-desktop && CGO_ENABLED=0 GOOS=darwin GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "../desktop_flutter/$APP/Contents/MacOS/gozar-core" ./cmd/gozar)
          test "$(lipo -archs "$APP/Contents/MacOS/gozar-core")" = "$ARCH"
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../QUIC-GO-LICENSE.txt ../QPACK-LICENSE.txt ../GO-DEPS-LICENSES.txt "$APP/Contents/Resources/"
          codesign --force --deep --sign - "$APP"
          mkdir -p out "$RUNNER_TEMP/gozar-extracted"
          python3 ../scripts/archive_macos.py "$APP" "out/Gozar-$ARTIFACT_NAME.tar.xz"
          tar -xJf "out/Gozar-$ARTIFACT_NAME.tar.xz" -C "$RUNNER_TEMP/gozar-extracted"
          codesign --verify --deep --strict "$RUNNER_TEMP/gozar-extracted/Gozar.app"
          EXTRACTED="$RUNNER_TEMP/gozar-extracted/Gozar.app"
          test "$(lipo -archs "$EXTRACTED/Contents/MacOS/Gozar")" = "$ARCH"
          test "$(lipo -archs "$EXTRACTED/Contents/MacOS/gozar-core")" = "$ARCH"
          while IFS= read -r -d '' framework; do
            name=$(basename "$framework" .framework)
            test "$(lipo -archs "$framework/Versions/A/$name")" = "$ARCH"
          done < <(find "$EXTRACTED/Contents/Frameworks" -mindepth 1 -maxdepth 1 -type d -name '*.framework' -print0)
          ls -lh out/*
      - name: Verify native macOS window with simulated core
        if: matrix.platform == 'darwin'
        working-directory: desktop_flutter
        shell: bash
        run: |
          set -e
          APP="$PWD/build/macos/Build/Products/Release/Gozar.app"
          go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/gozar-ui-test-core" ../scripts/ui-smoke-core.go
          swiftc ../scripts/test_macos_ui.swift -o "$RUNNER_TEMP/gozar-macos-ui-test"
          "$RUNNER_TEMP/gozar-macos-ui-test" "$APP/Contents/MacOS/Gozar" "$RUNNER_TEMP/gozar-ui-test-core" "$RUNNER_TEMP/gozar-macos-ui-visible.log" visible
          set +e
          "$RUNNER_TEMP/gozar-macos-ui-test" "$APP/Contents/MacOS/Gozar" "$RUNNER_TEMP/gozar-ui-test-core" "$RUNNER_TEMP/gozar-macos-ui-hidden.log" hidden
          hidden_status=$?
          set -e
          if [ "$hidden_status" = 77 ]; then
            echo '::warning::Hidden-window quit was not tested because this runner could not hide the app.'
          elif [ "$hidden_status" != 0 ]; then
            exit "$hidden_status"
          fi
      - name: Check download size
        working-directory: desktop_flutter
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" -c "import pathlib; files=list(pathlib.Path('out').iterdir()); assert files and all(f.stat().st_size < 17000000 for f in files), 'Desktop archive exceeds 17 MB'"
      - uses: actions/upload-artifact@v4
        with:
          name: gozar-${{ matrix.name }}
          path: desktop_flutter/out/*
          if-no-files-found: error

  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.6'
      - name: Auto selection, failover, split tunneling and idle proofs
        run: go test ./internal/app ./internal/engine ./internal/geo ./internal/killswitch ./internal/tunnel -count=1
      - name: Five minute idle soak
        env:
          GOZAR_IDLE_SOAK: '1'
        run: go test ./internal/engine -run '^TestIdleFiveMinutesSoak$' -count=1 -timeout 10m

  cores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: Linux-amd64
            ext: tar.xz
          - goos: linux
            goarch: arm64
            name: Linux-arm64
            ext: tar.xz
          - goos: windows
            goarch: amd64
            name: Windows-x64
            ext: zip
          - goos: windows
            goarch: arm64
            name: Windows-arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            name: macOS-Intel
            ext: tar.xz
          - goos: darwin
            goarch: arm64
            name: macOS-ARM
            ext: tar.xz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: go-desktop/go.sum
      - name: Build native core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CORE_NAME: ${{ matrix.name }}
          CORE_EXT: ${{ matrix.ext }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/core" out
          name=gozar-core
          flags='-s -w'
          if [ "$GOOS" = windows ]; then name=gozar-core.exe; flags='-s -w -H=windowsgui'; fi
          (cd go-desktop && go build -trimpath -ldflags="$flags" -o "$RUNNER_TEMP/core/$name" ./cmd/gozar)
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then "$RUNNER_TEMP/core/$name" --version; fi
          python3 scripts/package_core.py "$RUNNER_TEMP/core/$name" "out/Gozar-Core-$CORE_NAME.$CORE_EXT" "$GOOS" "$GOARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  packages:
    needs: [desktop]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: gozar-Linux-amd64
          path: linux-bundle
      - name: Install packaging tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd squashfs-tools patchelf fakeroot libarchive-tools elfutils flatpak flatpak-builder
      - name: Unpack the Linux bundle
        run: |
          set -e
          mkdir -p work
          tar -C work -xJf linux-bundle/Gozar-Linux-amd64.tar.xz
          test -x work/bundle/gozar-core
          test -x work/bundle/gozar
      - name: Version
        id: version
        run: echo "version=$(grep -m1 '^version:' desktop_flutter/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      - name: Build desktop packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          mkdir -p out
          scripts/package_appimage.sh "$PWD/work/bundle" "$PWD/out/Gozar-$VERSION-x86_64.AppImage" "$VERSION"
          scripts/package_snap.sh "$PWD/work/bundle" "$PWD/out/Gozar_${VERSION}_amd64.snap" "$VERSION"
          scripts/package_rpm.sh "$PWD/work/bundle" "$PWD/out" "$VERSION"
          scripts/package_arch.sh "$PWD/work/bundle" "$PWD/out/Gozar-$VERSION-x86_64.pkg.tar.zst" "$VERSION"
          scripts/package_flatpak.sh "$PWD/out" "$VERSION" "$PWD/linux-bundle/Gozar-Linux-amd64.tar.xz"
      - name: Build embedded packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          scripts/package_openwrt.sh "$VERSION" "$PWD/out"
          scripts/package_raspberrypi.sh "$PWD/out"
          python3 scripts/package_freebsd.py "$VERSION" "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*
          if-no-files-found: error

  publish:
    needs: [android, desktop, cores, packages, proof]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require same-commit Android install evidence
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sha=$(git rev-parse HEAD)
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[] | select(.name == "Test" and .event == "workflow_dispatch" and .conclusion == "success") | .id')
          found=false
          for id in $ids; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "android-recovery-emulator" and .conclusion == "success")] | length')
            if [ "$count" -gt 0 ]; then found=true; break; fi
          done
          if [ "$found" != true ]; then
            echo '::error::No successful Android emulator install/recovery run for this exact commit'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true
      - name: Versions
        id: version
        run: |
          set -e
          DESKTOP=$(grep -m1 '^version:' desktop_flutter/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          CORE=$(awk -F'"' '/^const version = / {print $2; exit}' go-desktop/cmd/gozar/main.go)
          if [ -z "$DESKTOP" ] || [ "$DESKTOP" != "$CORE" ]; then
            echo "::error::Desktop UI and core versions differ; signed update comparisons would be wrong"
            exit 1
          fi
          ANDROID=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          if [ -z "$ANDROID" ] || [ "$DESKTOP" != "$ANDROID" ]; then
            echo "::error::Android, desktop UI and desktop core must use the same release version"
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="v$ANDROID"; fi
          if [ "$TAG" != "v$ANDROID" ] && [ "$TAG" != "v$ANDROID-desktop" ]; then
            echo "::error::Release tag must match the Android version for signed updates"
            exit 1
          fi
          notes="docs/release-notes/$ANDROID.md"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            channel=$(python3 scripts/release_channel.py "$notes" --allow-draft)
          else
            channel=$(python3 scripts/release_channel.py "$notes")
          fi
          case "$channel" in
            prerelease|draft) prerelease=true ;;
            stable) prerelease=false ;;
            *) echo '::error::Unrecognized release channel'; exit 1 ;;
          esac
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check release files
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.android }}
          DESKTOP_VERSION: ${{ steps.version.outputs.desktop }}
        run: |
          set -e
          for f in "Gozar_${ANDROID_VERSION}_universal.apk" "Gozar_${ANDROID_VERSION}_arm64-v8a.apk" "Gozar_${ANDROID_VERSION}_armeabi-v7a.apk" "Gozar_${ANDROID_VERSION}_x86.apk" "Gozar_${ANDROID_VERSION}_x86_64.apk" Gozar-Windows-x64-Setup.exe Gozar-Windows-x64.zip Gozar-Linux-amd64.deb Gozar-Linux-amd64.tar.xz Gozar-macOS-ARM.tar.xz Gozar-macOS-Intel.tar.xz Gozar-Core-Linux-amd64.tar.xz Gozar-Core-Linux-arm64.tar.xz Gozar-Core-Windows-x64.zip Gozar-Core-Windows-arm64.zip Gozar-Core-macOS-Intel.tar.xz Gozar-Core-macOS-ARM.tar.xz "Gozar-${DESKTOP_VERSION}-x86_64.AppImage" "Gozar-${DESKTOP_VERSION}-x86_64.flatpak" "Gozar-${DESKTOP_VERSION}-x86_64.pkg.tar.zst" "Gozar_${DESKTOP_VERSION}_amd64.snap" Gozar-Fedora-x86_64.rpm Gozar-RHEL-x86_64.rpm Gozar-OpenWrt-mips_24kc.ipk Gozar-OpenWrt-mipsel_24kc.ipk Gozar-OpenWrt-armv7.ipk Gozar-OpenWrt-aarch64.ipk LuCI-Gozar-all.ipk Gozar-RaspberryPi-arm64.tar.xz Gozar-RaspberryPi-armv7.tar.xz Gozar-FreeBSD-amd64.pkg Gozar-FreeBSD-arm64.pkg; do
            test -s "collected/$f" || { echo "::error::Missing release file: $f"; exit 1; }
          done
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          test -n "$GPG_PRIVATE_KEY"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/gpg.asc"
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import "$RUNNER_TEMP/gpg.asc"
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          if [ "$FPR" != '4C83608102387A6EFFEB12E181A19769C40808F7' ]; then
            echo "::error::OpenPGP signing key does not match the published Gozar key"
            exit 1
          fi
          gpg --armor --export "$FPR" > collected/gozar-public-key.asc
      - name: Sign archives and APKs
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          cd collected
          for f in *.apk *.exe *.deb *.zip *.tar.xz *.rpm *.AppImage *.snap *.flatpak *.pkg.tar.zst *.ipk *.pkg; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output "$f.sig" "$f"
          done
      - name: Verify signatures
        run: |
          set -e
          mkdir -m 700 "$RUNNER_TEMP/verify-keyring"
          gpg --homedir "$RUNNER_TEMP/verify-keyring" --batch --import collected/gozar-public-key.asc
          cd collected
          for f in *.apk *.exe *.deb *.zip *.tar.xz *.rpm *.AppImage *.snap *.flatpak *.pkg.tar.zst *.ipk *.pkg; do
            [ -e "$f" ] || continue
            test -s "$f.sig"
            gpg --homedir "$RUNNER_TEMP/verify-keyring" --batch --verify "$f.sig" "$f"
          done
      - name: Sign Android and desktop update manifests
        env:
          GOZAR_UPDATE_KEY: ${{ secrets.GOZAR_UPDATE_KEY }}
          ANDROID_VERSION: ${{ steps.version.outputs.android }}
          DESKTOP_VERSION: ${{ steps.version.outputs.desktop }}
          GOZAR_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          test -n "$GOZAR_UPDATE_KEY" || { echo '::error::GOZAR_UPDATE_KEY is missing'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/gozar-update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$GOZAR_UPDATE_KEY" > "$key"
          plan="docs/recovery-plans/$ANDROID_VERSION.json"
          if [ -f "$plan" ]; then
            git ls-files --error-unmatch "$plan" >/dev/null
            python3 tools/validate-forward-recovery.py --plan "$plan" > "$RUNNER_TEMP/recovery-metadata.json"
            GOZAR_RECOVERY_PLAN="$RUNNER_TEMP/recovery-metadata.json" GOZAR_RELEASE_KEY="$key" bash tools/sign-update-manifest.sh "$ANDROID_VERSION" "1.8.0" collected "Gozar Android $ANDROID_VERSION"
          else
            GOZAR_RELEASE_KEY="$key" bash tools/sign-update-manifest.sh "$ANDROID_VERSION" "1.8.0" collected "Gozar Android $ANDROID_VERSION"
          fi
          GOZAR_RELEASE_KEY="$key" bash tools/sign-desktop-manifest.sh "$DESKTOP_VERSION" collected "Gozar desktop $DESKTOP_VERSION"
          for f in update.json update.json.sig desktop-update.json desktop-update.json.sig; do test -s "collected/$f"; done
      - name: Notes
        env:
          GOZAR_ALLOW_DRAFT_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_release && '1' || '0' }}
        run: python3 scripts/notes.py "${{ steps.version.outputs.desktop }}" "${{ github.repository }}" "${{ steps.version.outputs.android }}" "${{ steps.version.outputs.tag }}" > "$RUNNER_TEMP/notes.md"
      - name: Upload release-validation evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_release }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-evidence
          path: |
            collected/update.json
            collected/update.json.sig
            collected/desktop-update.json
            collected/desktop-update.json.sig
            collected/gozar-public-key.asc
          if-no-files-found: error
      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('Gozar Android {0} / Desktop {1}', steps.version.outputs.android, steps.version.outputs.desktop) }}
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
          files: collected/*
          fail_on_unmatched_files: true
      - name: Verify draft release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION: ${{ steps.version.outputs.android }}
          DESKTOP_VERSION: ${{ steps.version.outputs.desktop }}
        run: |
          set -e
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for f in "Gozar_${ANDROID_VERSION}_universal.apk" "Gozar_${ANDROID_VERSION}_arm64-v8a.apk" "Gozar_${ANDROID_VERSION}_armeabi-v7a.apk" "Gozar_${ANDROID_VERSION}_x86.apk" "Gozar_${ANDROID_VERSION}_x86_64.apk" Gozar-Windows-x64-Setup.exe Gozar-Windows-x64.zip Gozar-Linux-amd64.deb Gozar-Linux-amd64.tar.xz Gozar-macOS-ARM.tar.xz Gozar-macOS-Intel.tar.xz Gozar-Core-Linux-amd64.tar.xz Gozar-Core-Linux-arm64.tar.xz Gozar-Core-Windows-x64.zip Gozar-Core-Windows-arm64.zip Gozar-Core-macOS-Intel.tar.xz Gozar-Core-macOS-ARM.tar.xz "Gozar-${DESKTOP_VERSION}-x86_64.AppImage" "Gozar-${DESKTOP_VERSION}-x86_64.flatpak" "Gozar-${DESKTOP_VERSION}-x86_64.pkg.tar.zst" "Gozar_${DESKTOP_VERSION}_amd64.snap" Gozar-Fedora-x86_64.rpm Gozar-RHEL-x86_64.rpm Gozar-OpenWrt-mips_24kc.ipk Gozar-OpenWrt-mipsel_24kc.ipk Gozar-OpenWrt-armv7.ipk Gozar-OpenWrt-aarch64.ipk LuCI-Gozar-all.ipk Gozar-RaspberryPi-arm64.tar.xz Gozar-RaspberryPi-armv7.tar.xz Gozar-FreeBSD-amd64.pkg Gozar-FreeBSD-arm64.pkg; do
            printf '%s\n' "$assets" | grep -Fx "$f" >/dev/null
            printf '%s\n' "$assets" | grep -Fx "$f.sig" >/dev/null
          done
          for f in gozar-public-key.asc update.json update.json.sig desktop-update.json desktop-update.json.sig; do printf '%s\n' "$assets" | grep -Fx "$f" >/dev/null; done
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published"
          for f in collected/*; do
            name=$(basename "$f")
            test -s "$RUNNER_TEMP/published/$name"
            cmp "$f" "$RUNNER_TEMP/published/$name"
          done
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -e
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
          test "$draft" = true || { echo '::error::Release was visible before asset verification'; exit 1; }
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          elif [ "$PRERELEASE" = false ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            echo '::error::Invalid release channel'; exit 1
          fi
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @csv')
          test "$state" = "false,$PRERELEASE" || { echo "::error::Unexpected public release state: $state"; exit 1; }
          if [ "$PRERELEASE" = true ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
            test "$latest" != "$GITHUB_REF_NAME" || { echo '::error::Prerelease was incorrectly marked latest'; exit 1; }
          fi

  release-validation-complete:
    needs: [publish]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.validate_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Require actual release validation
        env:
          VALIDATION_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$VALIDATION_RESULT" != success ]; then
            echo "::error::Release validation was skipped or failed: $VALIDATION_RESULT"
            exit 1
          fi
