name: Prepare Qt desktop packages (validation only)

# This workflow builds with the exact checked-out UI and core, and publishes
# neither releases nor downloadable binaries. Only validation evidence leaves CI.
on:
  workflow_dispatch:
  push:
    branches: [packaging/qt-preparation]

permissions:
  contents: read

jobs:
  prepare:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: 'windows-2022', platform: 'windows', arch: 'amd64', host: 'windows', label: 'Windows-x64'}
          - {runner: 'ubuntu-24.04', platform: 'linux', arch: 'amd64', host: 'linux', label: 'Linux-amd64'}
          - {runner: 'macos-15-intel', platform: 'darwin', arch: 'amd64', host: 'mac', label: 'macOS-Intel'}
          - {runner: 'macos-15', platform: 'darwin', arch: 'arm64', host: 'mac', label: 'macOS-ARM'}
    env:
      GOOS: ${{ matrix.platform }}
      GOARCH: ${{ matrix.arch }}
      PACKAGE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.host }}
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          bash scripts/ci_apt.sh update -qq
          bash scripts/ci_apt.sh install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf libxcb-cursor0 libxkbcommon-x11-0
      - name: Build exact checkout core, Qt and tests
        id: native_tests
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/same-commit/gozar-core"
          ldflags='-s -w'
          if [[ "$GOOS" == windows ]]; then core+=.exe; ldflags+=' -H=windowsgui'; fi
          mkdir -p "$(dirname "$core")" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/packaging-evidence"
          (cd go-desktop && CGO_ENABLED=0 go build -trimpath -ldflags="$ldflags" -o "$core" ./cmd/gozar)
          cmake -S desktop_qt_adapter -B "$RUNNER_TEMP/production-layout-qt" -DBUILD_UPSTREAM_SMOKE_TEST=ON -DCMAKE_BUILD_TYPE=Release -DGOZAR_REAL_CORE="$core"
          cmake --build "$RUNNER_TEMP/production-layout-qt" --config Release --parallel 2
          ctest --test-dir "$RUNNER_TEMP/production-layout-qt" -C Release --output-on-failure
          python desktop_qt_adapter/branding/inventory_resources.py \
            --qrc "$RUNNER_TEMP/production-layout-qt/images.qrc" --repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/packaging-evidence/qt-source-resources.csv"
      - name: Preserve CTest diagnostics after a failed native test
        if: ${{ failure() && steps.native_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: qt-ctest-diagnostics-${{ matrix.label }}
          path: ${{ runner.temp }}/production-layout-qt/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage native packages with existing Qt handoff
        shell: bash
        run: bash scripts/stage_desktop_qt_packages.sh
      - name: Compile and test the standard Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/build_qt_windows_installer.ps1
      - name: Inventory the staged runtime payload for the source-delivery review
        shell: bash
        run: |
          set -euo pipefail
          case "$GOOS" in
            windows) payload="$RUNNER_TEMP/desktop-qt-package-stage" ;;
            linux) payload="$RUNNER_TEMP/desktop-extracted/bundle" ;;
            darwin) payload="$RUNNER_TEMP/desktop-extracted/Gozar.app" ;;
            *) exit 2 ;;
          esac
          python scripts/inventory_qt_staged_payload.py "$payload" \
            "$RUNNER_TEMP/packaging-evidence/staged-payload.csv"
      - name: Authenticate tools for the internal Qt AppImage
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_appimage_tools.sh "$RUNNER_TEMP/appimage-tools"
      - name: Build and validate the requested additional desktop formats
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python scripts/check_qt_release_prerequisites.py --metadata-only)
          mkdir -p "$RUNNER_TEMP/additional-formats"
          case "$GOOS" in
            linux)
              bundle="$RUNNER_TEMP/desktop-extracted/bundle"
              file="$RUNNER_TEMP/additional-formats/Gozar-$version-x86_64.AppImage"
              APPIMAGETOOL="$RUNNER_TEMP/appimage-tools/appimagetool-x86_64.AppImage" \
                APPIMAGE_RUNTIME_FILE="$RUNNER_TEMP/appimage-tools/runtime-x86_64" \
                bash scripts/package_appimage.sh "$bundle" "$file" "$version"
              bash scripts/verify_qt_appimage.sh "$file" "$bundle"
              ;;
            darwin)
              file="$RUNNER_TEMP/additional-formats/Gozar-$PACKAGE_LABEL.dmg"
              bash scripts/build_qt_macos_dmg.sh "$RUNNER_TEMP/desktop-extracted/Gozar.app" "$file"
              ;;
            *) exit 2 ;;
          esac
          python - "$file" "$RUNNER_TEMP/packaging-evidence/additional-format.json" <<'PY'
          import hashlib, json, pathlib, sys
          path, report = map(pathlib.Path, sys.argv[1:])
          assert path.is_file() and path.stat().st_size > 0
          with path.open('rb') as f:
              digest = hashlib.file_digest(f, 'sha256').hexdigest()
          report.write_text(json.dumps({'name': path.name, 'bytes': path.stat().st_size,
                                        'sha256': digest, 'publication_eligible': False}, indent=2) + '\n')
          PY
      - name: Record package evidence, not release eligibility
        shell: bash
        run: |
          python scripts/report_desktop_qt_package_preparation.py "$RUNNER_TEMP/packages" "$RUNNER_TEMP/packaging-evidence/desktop-packages.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qt-packaging-evidence-${{ matrix.label }}
          path: ${{ runner.temp }}/packaging-evidence/
          if-no-files-found: error
          retention-days: 14
