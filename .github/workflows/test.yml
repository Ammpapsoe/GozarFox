name: Test

on:
  push:
    branches: ['mission/**']
  pull_request:
  workflow_dispatch:
    inputs:
      android_recovery_emulator:
        description: Run the Android upgrade and forward-recovery emulator scenario
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-recovery-emulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_recovery_emulator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug upgrade fixtures
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
        run: bash scripts/build_recovery_test_apks.sh
      - name: Build and authenticate official-signed upgrade APKs
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
          XIAOMI_APP_ID: ${{ secrets.XIAOMI_APP_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build_official_upgrade_test_apks.sh
      - name: Configure emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; ls -l /dev/kvm; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'GOZAR_DISABLE_KVM=false' >> "$GITHUB_ENV"
          else
            echo '::warning::KVM is unavailable; using slower software emulation'
            echo 'GOZAR_DISABLE_KVM=true' >> "$GITHUB_ENV"
          fi
      - name: Test Android forward recovery on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: ${{ env.GOZAR_DISABLE_KVM }}
          emulator-boot-timeout: 1800
          script: >-
            GOZAR_PREVIOUS_APK=official-stable GOZAR_PREVIOUS_VERSION=1.10.4 GOZAR_EVIDENCE_LABEL=stable bash scripts/test_official_upgrade_emulator.sh &&
            GOZAR_PREVIOUS_APK=official-previous GOZAR_PREVIOUS_VERSION=1.11.1 GOZAR_EVIDENCE_LABEL=preview bash scripts/test_official_upgrade_emulator.sh &&
            bash scripts/test_recovery_emulator.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovery-emulator-evidence
          path: |
            ${{ runner.temp }}/recovery-apks/*journal.json
            ${{ runner.temp }}/recovery-apks/downgrade.log
            ${{ runner.temp }}/recovery-apks/window.xml
            ${{ runner.temp }}/recovery-apks/installer-window.xml
            ${{ runner.temp }}/recovery-apks/official-*-badging.txt
            ${{ runner.temp }}/recovery-apks/official-*-package.txt
            ${{ runner.temp }}/recovery-apks/official-*-launch.txt
          if-no-files-found: ignore

  desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Analyze and test desktop UI
        working-directory: desktop_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  desktop-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: go-desktop/go.sum
      - name: Test desktop update verification and RPC
        working-directory: go-desktop
        run: go test ./internal/update ./internal/rpc -count=1

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test release signing and notes
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: bash ./gradlew :core:test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: warn

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: App unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn
