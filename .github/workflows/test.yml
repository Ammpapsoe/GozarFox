name: Test

on:
  push:
    branches: ['mission/**']
  pull_request:
  workflow_dispatch:
    inputs:
      system_proxy_only:
        description: Run only focused system-proxy tests
        required: false
        type: boolean
        default: false
      fakedns_only:
        description: Run only focused FakeDNS tests (with system_proxy_only)
        required: false
        type: boolean
        default: false
      windows_live_tun:
        description: Run the privileged Windows kernel TUN integration test
        required: false
        type: boolean
        default: false
      skip_graphics_tests:
        description: Skip desktop UI tests for an explicitly approved expedited run
        required: false
        type: boolean
        default: false
      android_recovery_emulator:
        description: Run the Android upgrade and forward-recovery emulator scenario
        required: false
        type: boolean
        default: false
      android_native_pipeline_probe:
        description: Compare standard and pipelined SOCKS on native hev in an isolated Linux namespace
        required: false
        type: boolean
        default: false
      build_warp_live_probe:
        description: Build the opt-in Linux WARP live diagnostic (no credentials used in CI)
        required: false
        type: boolean
        default: false
      build_kotlin_warp_live_probe:
        description: Build the opt-in Kotlin WARP live diagnostic (no credentials used in CI)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-native-pipeline-probe:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (github.event_name == 'workflow_dispatch' && inputs.android_native_pipeline_probe) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Compile vendored native engine and fd harness
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/app/src/main/jni/hev-socks5-tunnel"
          make -C "$root" static -j2
          gcc -O2 -Wall -Werror "$GITHUB_WORKSPACE/tools/hev_fd_probe.c" \
            -Wl,--start-group "$root/bin/libhev-socks5-tunnel.a" \
            "$root/third-part/yaml/bin/libyaml.a" "$root/third-part/lwip/bin/liblwip.a" \
            "$root/third-part/hev-task-system/bin/libhev-task-system.a" -Wl,--end-group \
            -pthread -o "$RUNNER_TEMP/hev-fd-probe"
      - name: Exercise TCP, UDP and authentication in a disposable namespace
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/net/tun ]; then sudo mkdir -p /dev/net; sudo mknod /dev/net/tun c 10 200; fi
          sudo unshare --net --fork -- python3 tools/hev_pipeline_probe.py "$RUNNER_TEMP/hev-fd-probe"

  build-kotlin-warp-live-probe:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (github.event_name == 'workflow_dispatch' && inputs.build_kotlin_warp_live_probe) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated diagnostic (no credentials)
        run: bash ./gradlew :core:warpLiveProbeJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gozar-kotlin-warp-live
          path: core/build/libs/gozar-kotlin-warp-live.jar
          retention-days: 1

  build-warp-live-probe:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (github.event_name == 'workflow_dispatch' && inputs.build_warp_live_probe) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Build isolated diagnostics (no credentials)
        working-directory: go-desktop
        run: |
          go build -trimpath -o "$RUNNER_TEMP/gozar-warp-live" ./tools/warp-live
          go build -trimpath -o "$RUNNER_TEMP/gozar-account-live" ./tools/account-live
      - uses: actions/upload-artifact@v4
        with:
          name: gozar-warp-live-linux
          path: |
            ${{ runner.temp }}/gozar-warp-live
            ${{ runner.temp }}/gozar-account-live
          retention-days: 1

  android-recovery-emulator:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (github.event_name == 'workflow_dispatch' && inputs.android_recovery_emulator) }}
    # Historical signed APKs must be restored to a CI-only draft in this
    # repository; GitHub requires push access to read draft release assets.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug upgrade fixtures
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
        run: bash scripts/build_recovery_test_apks.sh
      - name: Build and authenticate official-signed upgrade APKs
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
          XIAOMI_APP_ID: ${{ secrets.XIAOMI_APP_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GOZAR_STABLE_FIXTURE_ASSET_ID: ${{ vars.GOZAR_STABLE_FIXTURE_ASSET_ID }}
          GOZAR_PREVIOUS_FIXTURE_ASSET_ID: ${{ vars.GOZAR_PREVIOUS_FIXTURE_ASSET_ID }}
          GOZAR_CORRECTED_FIXTURE_ASSET_ID: ${{ vars.GOZAR_CORRECTED_FIXTURE_ASSET_ID }}
        run: bash scripts/build_official_upgrade_test_apks.sh
      - name: Configure emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; ls -l /dev/kvm; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'GOZAR_DISABLE_KVM=false' >> "$GITHUB_ENV"
          else
            echo '::warning::KVM is unavailable; using slower software emulation'
            echo 'GOZAR_DISABLE_KVM=true' >> "$GITHUB_ENV"
          fi
      - name: Test Android forward recovery on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOZAR_APK_DIR: ${{ runner.temp }}/recovery-apks
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: ${{ env.GOZAR_DISABLE_KVM }}
          emulator-boot-timeout: 1800
          script: >-
            GOZAR_PREVIOUS_APK=official-stable GOZAR_PREVIOUS_VERSION=1.10.4 GOZAR_EVIDENCE_LABEL=stable bash scripts/test_official_upgrade_emulator.sh &&
            GOZAR_PREVIOUS_APK=official-previous GOZAR_PREVIOUS_VERSION=1.11.1 GOZAR_EVIDENCE_LABEL=preview bash scripts/test_official_upgrade_emulator.sh &&
            GOZAR_PREVIOUS_APK=official-corrected GOZAR_PREVIOUS_VERSION=1.11.2 GOZAR_EVIDENCE_LABEL=corrected bash scripts/test_official_upgrade_emulator.sh &&
            bash scripts/test_recovery_emulator.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovery-emulator-evidence
          path: |
            ${{ runner.temp }}/recovery-apks/*journal.json
            ${{ runner.temp }}/recovery-apks/downgrade.log
            ${{ runner.temp }}/recovery-apks/window.xml
            ${{ runner.temp }}/recovery-apks/installer-window.xml
            ${{ runner.temp }}/recovery-apks/official-*-badging.txt
            ${{ runner.temp }}/recovery-apks/official-*-package.txt
            ${{ runner.temp }}/recovery-apks/official-*-launch.txt
          if-no-files-found: ignore

  relay-worker:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/worker/package-lock.json
      - name: Test Worker policy and validate deployment configuration
        working-directory: relay/worker
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Verify the published endpoint signature when present
        run: |
          if [ -f packaging/relay-endpoints.json.sig ]; then
            bash tools/verify-relay-endpoints.sh
          else
            echo 'signature pending from Sign relay endpoints workflow'
          fi

  desktop-core-cross-build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, windows-amd64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Build desktop core for ${{ matrix.target }}
        working-directory: go-desktop
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          GOOS=${TARGET%-*} GOARCH=${TARGET#*-} go build -trimpath -o "$RUNNER_TEMP/gozar-core" ./cmd/gozar

  windows-proxy-registry:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test proxy registry adapter in an isolated user key
        working-directory: go-desktop
        run: go test ./internal/sysproxy -count=1
      - name: Test real WinINet lifecycle on disposable Windows runner
        working-directory: go-desktop
        shell: bash
        env:
          GOZAR_DISPOSABLE_WININET_TEST: '1'
        run: |
          set -euo pipefail
          go test -tags proxyexperiment ./internal/sysproxy -run '^(TestWinINetRealRoundTrip|TestLANExperimentTransaction|TestLANExperimentRegistryJournal|TestLANExperimentRealCrash|TestLANExperimentAncillaryOptions|TestLANExperimentRealWatchdog)$' -count=1 -v
          go test -tags proxyexperiment ./internal/app -run '^TestSystemProxyExperimentalAppIntegration$' -count=1 -v

  windows-mode-contract:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test Windows mode contract and proxy non-mutation
        working-directory: go-desktop
        run: go test ./internal/config ./internal/app ./internal/rpc -run '^TestConnectionMode' -count=1


  focused-system-proxy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.system_proxy_only && !inputs.fakedns_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test proxy transaction and lifecycle
        working-directory: go-desktop
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/gozar-focused" ./cmd/gozar
          go test ./internal/sysproxy -count=1
          go test ./internal/app ./internal/rpc -run '^(TestConnectionMode|TestSystemProxy)' -count=1
          if [ "${{ runner.os }}" = Linux ]; then
            go test -race ./internal/sysproxy ./internal/localproxy ./internal/app ./internal/rpc -count=1
            go test ./internal/engine -run '^(TestFakeDNS|TestJournalFakeDNS)' -count=1
          fi
      - name: Test real WinINet settings (disposable runner only)
        if: ${{ runner.os == 'Windows' }}
        working-directory: go-desktop
        env:
          GOZAR_DISPOSABLE_WININET_TEST: '1'
        shell: bash
        run: |
          set -euo pipefail
          go test -tags proxyexperiment ./internal/sysproxy -run '^(TestWinINetRealRoundTrip|TestLANExperimentTransaction|TestLANExperimentRegistryJournal|TestLANExperimentRealCrash|TestLANExperimentAncillaryOptions|TestLANExperimentRealWatchdog)$' -count=1 -v
          go test -tags proxyexperiment ./internal/app -run '^TestSystemProxyExperimentalAppIntegration$' -count=1 -v

  focused-fakedns:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.system_proxy_only && inputs.fakedns_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test FakeDNS mapping, journal and UDP
        working-directory: go-desktop
        run: go test ./internal/engine -run '^(TestFakeDNS|TestJournalFakeDNS)' -count=1

  focused-fakedns-live-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.system_proxy_only && inputs.fakedns_only && inputs.windows_live_tun }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test FakeDNS reconnect through real Wintun and a local relay
        working-directory: go-desktop
        shell: pwsh
        env:
          GOZAR_LIVE_TUN_TEST: '1'
          GOZAR_FAKEDNS_PRODUCTION_STORAGE_TEST: '1'
        run: go test ./internal/engine -run '^TestFakeDNS(LiveKernelReconnect|ProductionWindowsStorage)$' -count=1 -v -timeout=120s
      - name: Check machine identity across two Windows administrator accounts
        working-directory: go-desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramData 'GozarFox-FakeDNS-Machine-v1'
          $key = 'HKLM:\SOFTWARE\GozarFox\FakeDNSMachineV1'
          if ((Test-Path $root) -or (Test-Path $key)) { throw 'Refusing to touch pre-existing production DNS state' }
          $id = [guid]::NewGuid().ToString('N').Substring(0,10)
          $user = 'gztest' + $id
          $work = Join-Path $env:ProgramData ('GozarFox-FakeDNS-CI-' + $id)
          $owned = $false
          $createdUser = $false
          try {
            New-Item -ItemType Directory -Path $work | Out-Null
            go test -c -o "$work\engine.test.exe" ./internal/engine
            if ($LASTEXITCODE -ne 0) { throw 'Failed to compile helper' }
            $password = ConvertTo-SecureString ('Aa1!' + [guid]::NewGuid().ToString('N') + 'zZ2!') -AsPlainText -Force
            New-LocalUser -Name $user -Password $password -PasswordNeverExpires | Out-Null
            $createdUser = $true
            Add-LocalGroupMember -Group 'Administrators' -Member $user
            $credential = [pscredential]::new("$env:COMPUTERNAME\$user", $password)
            $env:GOZAR_FAKEDNS_CROSS_USER = '1'
            $owned = $true
            $first = & "$work\engine.test.exe" '-test.v' '-test.run=^TestFakeDNSCrossUserWindowsHelper$' '-test.timeout=45s' 2>&1
            if ($LASTEXITCODE -ne 0) { $first | Write-Host; throw 'First account failed' }
            $process = Start-Process -FilePath "$work\engine.test.exe" -WorkingDirectory $work -Credential $credential -LoadUserProfile -ArgumentList '-test.v','-test.run=^TestFakeDNSCrossUserWindowsHelper$','-test.timeout=45s' -RedirectStandardOutput "$work\second.out" -RedirectStandardError "$work\second.err" -PassThru -Wait
            $second = Get-Content "$work\second.out"
            if ($process.ExitCode -ne 0) { $second | Write-Host; Get-Content "$work\second.err" | Write-Host; throw 'Second account failed' }
            $a = @($first | Where-Object { $_ -match '^IDENTITY (\S+) (\S+)$' })
            $b = @($second | Where-Object { $_ -match '^IDENTITY (\S+) (\S+)$' })
            if ($a.Count -ne 1 -or $b.Count -ne 1) { throw 'Missing identity evidence' }
            $aa = $a[0].ToString().Split(' '); $bb = $b[0].ToString().Split(' ')
            if ($aa[1] -eq $bb[1] -or $aa[2] -ne $bb[2]) { throw 'Distinct accounts did not share the same DNS identity' }
            Write-Host 'Distinct administrator SIDs recovered the same synthetic address.'
          } finally {
            Remove-Item Env:GOZAR_FAKEDNS_CROSS_USER -ErrorAction SilentlyContinue
            if ($createdUser) { Remove-LocalUser -Name $user -ErrorAction SilentlyContinue }
            if ($owned) { Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue; Remove-Item -Recurse -Force $key -ErrorAction SilentlyContinue }
            Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          }

  focused-fakedns-live-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.system_proxy_only && inputs.fakedns_only && inputs.windows_live_tun }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test FakeDNS reconnect through isolated kernel TUN and a local relay
        working-directory: go-desktop
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/fakedns-live.test" ./internal/engine
          sudo mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; fi
          sudo unshare --net --mount --fork -- env GITHUB_ACTIONS=true GOZAR_LIVE_TUN_TEST=1 GOZAR_FAKEDNS_PRODUCTION_STORAGE_TEST=1 TEST_BINARY="$RUNNER_TEMP/fakedns-live.test" bash -eu -c '
            mount --make-rprivate /
            temp=$(mktemp)
            varlib=$(mktemp -d)
            trap "rm -f $temp; rm -rf $varlib" EXIT
            printf "nameserver 127.0.0.1\n" > "$temp"
            mount --bind "$temp" /etc/resolv.conf
            mount --bind "$varlib" /var/lib
            ip link set lo up
            "$TEST_BINARY" -test.v -test.run="^TestFakeDNS(LiveKernelReconnect|ProductionLinuxStorage)$" -test.timeout=120s
          '

  focused-mode-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.system_proxy_only && !inputs.fakedns_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Test connection mode control
        working-directory: desktop_flutter
        run: |
          flutter pub get
          flutter test test/ui_test.dart --name 'connection mode'

  windows-live-tun:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (github.event_name == 'workflow_dispatch' && inputs.windows_live_tun) }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Compile and test the real Windows TUN
        working-directory: go-desktop
        shell: pwsh
        run: |
          go test -c -o "$env:RUNNER_TEMP/gozar-live-tun.test.exe" ./internal/engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          & "$env:RUNNER_TEMP/gozar-live-tun.test.exe" '-test.v' '-test.run=^TestLiveKernelTunnel$' '-test.timeout=75s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out the v1.18.2 source for a local baseline
        uses: actions/checkout@v5
        with:
          ref: 5286e637921b9f47b4a748e7c2ad74ae6661f8a9
          path: baseline-source
          persist-credentials: false
      - name: Measure v1.18.2 local Wintun baseline
        continue-on-error: true
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $baseModule = ((Get-Content "$root/baseline-source/go-desktop/go.mod" -First 1) -replace '^module\s+', '').Trim()
          $currentModule = ((Get-Content "$root/go-desktop/go.mod" -First 1) -replace '^module\s+', '').Trim()
          $test = Get-Content "$root/go-desktop/internal/engine/live_throughput_windows_test.go" -Raw
          $test = $test.Replace("$currentModule/internal/wintun", "$baseModule/internal/wintun")
          [System.IO.File]::WriteAllText("$root/baseline-source/go-desktop/internal/engine/live_throughput_windows_test.go", $test, [System.Text.UTF8Encoding]::new($false))
          Push-Location "$root/baseline-source/go-desktop"
          try {
            go test -c -o "$env:RUNNER_TEMP/gozar-baseline.test.exe" ./internal/engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:GOZAR_LIVE_TUN_TEST = '1'
            $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
            & "$env:RUNNER_TEMP/gozar-baseline.test.exe" '-test.v' '-test.run=^TestLiveKernelTCPThroughput$' '-test.count=1' '-test.timeout=100s'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Measure current local Wintun path
        id: current_throughput
        continue-on-error: true
        shell: pwsh
        run: |
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          & "$env:RUNNER_TEMP/gozar-live-tun.test.exe" '-test.v' '-test.run=^TestLiveKernelTCPThroughput$' '-test.count=5' '-test.timeout=240s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose current local path without RACK (test-only)
        id: no_rack_throughput
        continue-on-error: true
        shell: pwsh
        run: |
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          $env:GOZAR_PERF_DISABLE_RACK = '1'
          & "$env:RUNNER_TEMP/gozar-live-tun.test.exe" '-test.v' '-test.run=^TestLiveKernelTCPThroughput$' '-test.count=5' '-test.timeout=240s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report production-default diagnostic failure
        if: ${{ steps.current_throughput.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Error 'The production-default Wintun diagnostic failed; see individual steps for the test-only RACK comparison.'
          exit 1

  desktop-ui:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) && (!(github.event_name == 'workflow_dispatch' && inputs.skip_graphics_tests)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux UI dependencies
        run: |
          bash scripts/ci_apt.sh update -qq
          bash scripts/ci_apt.sh install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Analyze and test desktop UI
        working-directory: desktop_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  desktop-update:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test desktop update verification and RPC
        working-directory: go-desktop
        run: go test ./internal/update ./internal/rpc -count=1

  desktop-protocols:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Test UDP packet forwarding, capsule framing and HTTP/2 streams
        working-directory: go-desktop
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/gozar-desktop-protocols.log"
          set +e
          skip='^$'
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_graphics_tests }}" = 'true' ]; then
            skip='(?i)(sign.?in|login|signup|unblock|blocked.*sign|verification.*session|session.*verification)'
          fi
          go test -skip "$skip" -race ./internal/relay ./internal/fxa ./internal/masque ./internal/tunnel ./internal/engine ./internal/warp ./internal/config ./internal/app ./internal/rpc ./internal/localproxy ./internal/sysproxy -count=1 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$log" <<'PY'
          import re
          import sys
          pattern = re.compile(r'(--- FAIL|panic|DATA RACE|FAIL\s|fatal error|expected|actual|timeout|\.go:\d+:)', re.I)
          count = 0
          with open(sys.argv[1], errors='replace') as source:
              for raw in source:
                  line = raw.strip()
                  if not line or not pattern.search(line):
                      continue
                  line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + line[:900])
                  count += 1
                  if count >= 60:
                      break
          PY
          fi
          exit "$status"

  release-tools:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test release signing and notes
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  core:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        env:
          SKIP_LOGIN_AND_GRAPHICS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_graphics_tests && 'true' || 'false' }}
        run: bash ./gradlew :core:test --no-daemon --stacktrace -PgozarSkipLoginAndGraphics="$SKIP_LOGIN_AND_GRAPHICS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: warn

  app:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.system_proxy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: App unit tests
        env:
          SKIP_LOGIN_AND_GRAPHICS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_graphics_tests && 'true' || 'false' }}
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -PgozarSkipLoginAndGraphics="$SKIP_LOGIN_AND_GRAPHICS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn
