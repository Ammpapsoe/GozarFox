name: Experimental Qt real-core build (NOT a release)

# Offline UI fixtures and signed-out smoke checks run before upload.
# No real account sign-in or live tunnel is exercised.
# Artifacts are development builds for deliberate owner evaluation, not a
# release or a determination that distribution obligations are satisfied.
on:
  workflow_call:
    inputs:
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  experimental-build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-2022","qt_host":"windows","platform":"windows","arch":"amd64","artifact":"Windows-x64"}]' || '[{"os":"windows-2022","qt_host":"windows","platform":"windows","arch":"amd64","artifact":"Windows-x64"},{"os":"ubuntu-24.04","qt_host":"linux","platform":"linux","arch":"amd64","artifact":"Linux-x64"},{"os":"macos-15-intel","qt_host":"mac","platform":"darwin","arch":"amd64","artifact":"macOS-Intel"},{"os":"macos-15","qt_host":"mac","platform":"darwin","arch":"arm64","artifact":"macOS-ARM"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Linux build prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf
      - name: Verify and extract the official Gozar 1.19.0 core
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          filename=gozar-core
          if [[ "$PLATFORM" == windows ]]; then filename=gozar-core.exe; fi
          core="${RUNNER_TEMP}/official-gozar/${filename}"
          python desktop_qt_adapter/fetch-release-core.py "$ARTIFACT" "$core"
          echo "GOZAR_OFFICIAL_CORE=$core" >> "$GITHUB_ENV"
      - name: Build and verify the Qt integration
        shell: bash
        run: |
          set -euo pipefail
          cmake -S desktop_qt_adapter -B "${RUNNER_TEMP}/qt-build" -DBUILD_UPSTREAM_SMOKE_TEST=ON -DCMAKE_BUILD_TYPE=Release -DGOZAR_REAL_CORE="$GOZAR_OFFICIAL_CORE"
          cmake --build "${RUNNER_TEMP}/qt-build" --config Release --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/qt-build" -C Release --output-on-failure
      - name: Capture actual Qt UI with fixture data
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/qt-build/gozar_qt_handoff_fixture"
          if [[ "$RUNNER_OS" == Windows ]]; then fixture="${RUNNER_TEMP}/qt-build/Release/gozar_qt_handoff_fixture.exe"; fi
          # Use the native Windows Qt backend, not Windows display-setting overrides.
          if [[ "$RUNNER_OS" == Windows ]]; then export QT_QPA_PLATFORM=windows; fi
          output="${RUNNER_TEMP}/gozar-ui-screenshots"
          mkdir -p "$output/en" "$output/fa" "$output/en-125" "$output/fa-125" "$output/en-150" "$output/fa-150"
          GOZAR_VISUAL_DIR="$output/en" "$fixture" --ci-layout
          GOZAR_VISUAL_DIR="$output/fa" GOZAR_VISUAL_FARSI=1 "$fixture" --ci-layout
          for scale in 125 150; do
            factor=1.25
            if [[ "$scale" == 150 ]]; then factor=1.5; fi
            QT_SCALE_FACTOR="$factor" GOZAR_VISUAL_DIR="$output/en-$scale" "$fixture" --ci-layout
            QT_SCALE_FACTOR="$factor" GOZAR_VISUAL_FARSI=1 GOZAR_VISUAL_DIR="$output/fa-$scale" "$fixture" --ci-layout
          done
          for locale in en fa en-125 fa-125 en-150 fa-150; do
            for image in compact-home connected connection-settings account account-switcher server-list search favourites tray-menu about updates session support; do
              test -s "$output/$locale/$image.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gozar-qt-screenshots-${{ matrix.artifact }}
          path: ${{ runner.temp }}/gozar-ui-screenshots
          if-no-files-found: error
          retention-days: 7
      - name: Build Windows development bundle
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop_flutter
          flutter pub get
          export GOZAR_HANDOFF_TEST_CORE="${RUNNER_TEMP}/qt-build/Release/fake_core.exe"
          export GOZAR_HANDOFF_TEST_QT="${RUNNER_TEMP}/qt-build/Release/gozar_qt_handoff_fixture.exe"
          test -s "$GOZAR_HANDOFF_TEST_CORE" && test -s "$GOZAR_HANDOFF_TEST_QT"
          flutter analyze
          flutter test --no-pub test/ui_test.dart test/core_handoff_test.dart test/ui_handoff_test.dart
          flutter build windows --release --dart-define=GOZAR_EXPERIMENTAL_ORIGINAL_QT=true
          runner=$(find build/windows -path '*/runner/Release/gozar.exe' -print -quit)
          test -n "$runner"
          folder="${RUNNER_TEMP}/gozar-qt-windows-stage"
          mkdir -p "$folder"
          cp -a "$(dirname "$runner")/." "$folder/"
          find "$folder" -type f \( -iname '*.pdb' -o -iname '*.lib' -o -iname '*.exp' \) -delete
          cp "${RUNNER_TEMP}/qt-build/Release/gozar-original-ui.exe" "$folder/gozar-original-ui.exe"
          cp "$GOZAR_OFFICIAL_CORE" "$folder/gozar-core.exe"
          windeployqt --release --no-translations --no-compiler-runtime --dir "$folder" "$folder/gozar-original-ui.exe"
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../QUIC-GO-LICENSE.txt ../QPACK-LICENSE.txt ../GO-DEPS-LICENSES.txt "$folder/"
          cp ../desktop_qt_adapter/vendor/windscribe/LICENSE "$folder/WINDSCRIBE-GPL-2-LICENSE.txt"
          cp ../desktop_qt_adapter/branding/VAZIRMATN-OFL.txt "$folder/"
          cp ../desktop_qt_adapter/EXPERIMENTAL-WARNING.txt "$folder/"
      - name: Compile one unsigned experimental Windows setup EXE
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'gozar-qt-windows-stage'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not available' }
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$redist) { throw 'Visual C++ Redistributable files not found' }
          $crt = Join-Path $redist.FullName 'x64\Microsoft.VC143.CRT'
          Copy-Item "$crt\*.dll" $stage
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $compiler)) { choco install nsis --no-progress -y }
          if (!(Test-Path $compiler)) { throw 'NSIS compiler not available' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'qt-build-output'
          New-Item -ItemType Directory -Force $out | Out-Null
          $removal = Join-Path $env:RUNNER_TEMP 'gozar-qt-remove.nsh'
          python packaging/windows/nsis-preview-payload.py $stage $removal
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate uninstall manifest' }
          & $compiler /V2 "/DWIZARD_FILE=$env:GITHUB_WORKSPACE\packaging\windows\wizard.bmp" "/DHEADER_FILE=$env:GITHUB_WORKSPACE\packaging\windows\header.bmp" "/DPAYLOAD_PATTERN=$stage\*.*" "/DREMOVE_PAYLOAD=$removal" "/DOUTPUT=$out\Gozar-Qt-Experimental-Windows-x64-Setup.exe" "/DICON_FILE=$env:GITHUB_WORKSPACE\desktop_flutter\windows\runner\resources\app_icon.ico" packaging/windows/gozar-qt-preview.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compile setup EXE' }
      - name: Install, smoke-test with unchanged core, and uninstall
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/test_qt_preview_installer.ps1 -Installer ./qt-build-output/Gozar-Qt-Experimental-Windows-x64-Setup.exe -VerifiedCore "$env:GOZAR_OFFICIAL_CORE"
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: gozar-qt-windows-test-exe
          path: qt-build-output/Gozar-Qt-Experimental-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build Linux development bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd desktop_flutter
          flutter pub get
          flutter test --no-pub test/ui_test.dart --name "Qt add-account route defers handoff until Flutter cancel"
          flutter build linux --release --dart-define=GOZAR_EXPERIMENTAL_ORIGINAL_QT=true
          folder=build/linux/x64/release/bundle
          cp "${RUNNER_TEMP}/qt-build/gozar-original-ui" "$folder/gozar-original-ui"
          cp "$GOZAR_OFFICIAL_CORE" "$folder/gozar-core"
          mkdir -p "$folder/qt/lib" "$folder/qt/plugins"
          cp -a "$QT_ROOT_DIR"/lib/libQt6*.so* "$folder/qt/lib/"
          for pattern in 'libicu*.so*' 'libxcb*.so*'; do
            for item in "$QT_ROOT_DIR"/lib/$pattern; do
              if [ -e "$item" ]; then cp -a "$item" "$folder/qt/lib/"; fi
            done
          done
          cp -a "$QT_ROOT_DIR"/plugins/. "$folder/qt/plugins/"
          patchelf --set-rpath '$ORIGIN/qt/lib' "$folder/gozar-original-ui"
          printf '[Paths]\nPrefix = qt\nLibraries = lib\nPlugins = plugins\n' > "$folder/qt.conf"
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../GO-DEPS-LICENSES.txt "$folder/"
          cp ../desktop_qt_adapter/vendor/windscribe/LICENSE "$folder/WINDSCRIBE-GPL-2-LICENSE.txt"
          cp ../desktop_qt_adapter/branding/VAZIRMATN-OFL.txt "$folder/"
          cp ../desktop_qt_adapter/EXPERIMENTAL-WARNING.txt "$folder/"
          mkdir -p ../qt-build-output
          tar -C build/linux/x64/release -cJf ../qt-build-output/Gozar-Qt-EXPERIMENTAL-Linux-x64.tar.xz bundle
      - name: Build macOS development bundle
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          cd desktop_flutter
          flutter pub get
          flutter build macos --release --dart-define=GOZAR_EXPERIMENTAL_ORIGINAL_QT=true
          app=build/macos/Build/Products/Release/Gozar.app
          cp "${RUNNER_TEMP}/qt-build/gozar-original-ui" "$app/Contents/MacOS/gozar-original-ui"
          cp "$GOZAR_OFFICIAL_CORE" "$app/Contents/MacOS/gozar-core"
          macdeployqt "$app" -executable="$app/Contents/MacOS/gozar-original-ui"
          cp ../LICENSE ../NOTICE ../WINTUN-LICENSE.txt ../GO-DEPS-LICENSES.txt "$app/Contents/Resources/"
          cp ../desktop_qt_adapter/vendor/windscribe/LICENSE "$app/Contents/Resources/WINDSCRIBE-GPL-2-LICENSE.txt"
          cp ../desktop_qt_adapter/branding/VAZIRMATN-OFL.txt "$app/Contents/Resources/"
          cp ../desktop_qt_adapter/EXPERIMENTAL-WARNING.txt "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          mkdir -p ../qt-build-output
          tar -C "$(dirname "$app")" -cJf "../qt-build-output/Gozar-Qt-EXPERIMENTAL-${ARTIFACT}.tar.xz" Gozar.app
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'windows'
        with:
          name: gozar-qt-real-core-${{ matrix.artifact }}-EXPERIMENTAL-NOT-RELEASE
          path: qt-build-output/*
          if-no-files-found: error
          retention-days: 7
