name: Refresh Android release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-refresh-1.10.1
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'bardia049b-stack/Gozar1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      XIAOMI_APP_ID: ${{ secrets.XIAOMI_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          test -n "$KEYSTORE_BASE64"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gozar-release.jks"
      - name: Build signed Android APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/gozar-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -s "$KEYSTORE_FILE"
          bash ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          mkdir -p out
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "out/Gozar_1.10.1_$abi.apk"
          done
      - name: Verify identity and sign release files
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          FINGERPRINT=$(gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          test "$FINGERPRINT" = 4C83608102387A6EFFEB12E181A19769C40808F7
          for file in out/*.apk; do
            info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$file")
            grep -F "versionCode='33' versionName='1.10.1'" <<< "$info" > /dev/null
            info=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$file")
            grep -Fx 'Number of signers: 1' <<< "$info" > /dev/null
            actual=$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' <<< "$info")
            test "$actual" = bc9d3368f2671175f81be047a1ff72bca0cfc58e8b1b8f9f87e24694ba45f5b1
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$FINGERPRINT" --detach-sign --output "$file.sig" "$file"
            gpg --batch --verify "$file.sig" "$file"
          done
          python3 scripts/notes.py 1.10.1 "$GITHUB_REPOSITORY" 1.10.1 v1.10.1-desktop > "$RUNNER_TEMP/gozar-notes.md"
      - name: Update the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/gozar-notes.md
        run: python3 scripts/refresh_android_release.py
