name: Windscribe Qt UI integration (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - 'wip/original-windscribe-ui'

permissions:
  contents: read

jobs:
  ui-transport:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
          - os: windows-2022
            qt_host: windows
          - os: macos-15-intel
            qt_host: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: go-desktop/go.sum
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          cache: true
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build unchanged Gozar core
        shell: bash
        working-directory: go-desktop
        run: |
          set -euo pipefail
          suffix=''
          if [[ "${RUNNER_OS}" == Windows ]]; then suffix='.exe'; fi
          go build -o "${RUNNER_TEMP}/gozar-core${suffix}" ./cmd/gozar
          echo "GOZAR_CI_TEST_CORE=${RUNNER_TEMP}/gozar-core${suffix}" >> "$GITHUB_ENV"
      - name: Configure Qt adapter and upstream widget tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S desktop_qt_adapter -B "${RUNNER_TEMP}/qt-check" \
            -DBUILD_UPSTREAM_SMOKE_TEST=ON \
            -DGOZAR_REAL_CORE="${GOZAR_CI_TEST_CORE}"
      - name: Inventory simulation resource inputs (not release approval)
        shell: bash
        run: |
          python desktop_qt_adapter/branding/inventory_resources.py \
            --qrc "${RUNNER_TEMP}/qt-check/images.qrc" \
            --repository "${GITHUB_WORKSPACE}" \
            --output "${RUNNER_TEMP}/qt-resource-inventory.csv"
      - uses: actions/upload-artifact@v4
        if: matrix.qt_host == 'linux'
        with:
          name: qt-development-resource-inventory-not-release
          path: ${{ runner.temp }}/qt-resource-inventory.csv
          if-no-files-found: error
      - name: Build
        shell: bash
        run: cmake --build "${RUNNER_TEMP}/qt-check" --config Release --parallel 2
      - name: Run consolidated integration check
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "${RUNNER_TEMP}/qt-check" -C Release --output-on-failure
          fake="${RUNNER_TEMP}/qt-check/fake_core"
          qt_fixture="${RUNNER_TEMP}/qt-check/gozar_qt_handoff_fixture"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            fake="${RUNNER_TEMP}/qt-check/Release/fake_core.exe"
            qt_fixture="${RUNNER_TEMP}/qt-check/Release/gozar_qt_handoff_fixture.exe"
          fi
          export GOZAR_HANDOFF_TEST_CORE="$fake"
          export GOZAR_HANDOFF_TEST_QT="$qt_fixture"
          cd desktop_flutter
          flutter pub get
          flutter analyze
          flutter test --no-pub test/ui_test.dart test/core_handoff_test.dart test/ui_handoff_test.dart
      - name: Collect development dependency evidence (not a release SBOM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qt-dependency-evidence"
          (cd go-desktop && go list -m -json all > "${RUNNER_TEMP}/qt-dependency-evidence/go-modules.jsons")
          (cd go-desktop && go list -deps -json ./cmd/gozar > "${RUNNER_TEMP}/qt-dependency-evidence/go-packages.jsons")
          (cd desktop_flutter && flutter pub deps --json > "${RUNNER_TEMP}/qt-dependency-evidence/flutter-deps.json")
          cp "${RUNNER_TEMP}/qt-resource-inventory.csv" "${RUNNER_TEMP}/qt-dependency-evidence/resources.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: qt-development-dependency-evidence-${{ matrix.qt_host }}-not-release
          path: ${{ runner.temp }}/qt-dependency-evidence/
          if-no-files-found: error
