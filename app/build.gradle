plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreFile = System.getenv('KEYSTORE_FILE')
def hasSigning = keystoreFile != null && !keystoreFile.isEmpty() && file(keystoreFile).exists()

android {
    namespace 'com.gozar'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.gozar'
        minSdk 24
        targetSdk 35
        // Prebuilt strip-mined NDK that CI installs explicitly.
        ndkVersion '27.0.12077973'
        versionCode 67
        versionName '1.18.1'
        manifestPlaceholders.appLabel = '@string/app_name'
        manifestPlaceholders.xiaomiAppId = System.getenv('XIAOMI_APP_ID') ?: ''
        manifestPlaceholders.xiaomiDebug = 'false'
        if (project.hasProperty('gozarDiagnostic')) {
            applicationIdSuffix '.diagnostic'
            versionNameSuffix '-test'
            manifestPlaceholders.appLabel = 'Gozar Test'
        }
        resourceConfigurations += ['en', 'fa']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    externalNativeBuild {
        ndkBuild {
            // Builds the vendored hev-socks5-tunnel shared library.
            path 'src/main/jni/Android.mk'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasSigning ? signingConfigs.release : null
        }
        debug {
            manifestPlaceholders.xiaomiDebug = 'true'
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // Netty 4.1 ships these in every jar; duplicates are meaningless in an APK.
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '384m'
            jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    // Declared again for the instrumentation APK rather than relying on the
    // tested variant's classpath: the screen-evidence test asks WebViewFeature
    // directly which capabilities this image really has.
    androidTestImplementation 'androidx.webkit:webkit:1.18.0'
    implementation project(':core')
    // Declared again for the Android packaging even though :core brings them
    // transitively at runtime: the Android artifact variant of OkHttp is the
    // one that should end up in the APK.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'dnsjava:dnsjava:3.7.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // WebMessageListener and document-start injection: the only way to hear a
    // Firefox Accounts WebChannel announcement from a page we host.
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    // Real backdrop refraction for the sheet surfaces, the settings rows and
    // the hero card. Prebuilt for arm64-v8a and armeabi-v7a; the code falls
    // back to a plain translucent surface everywhere else, so x86 builds and
    // the JVM unit tests never load its native kernels.
    implementation 'com.github.QWEA0:liquidglass:v2.0.11'
    implementation 'com.google.android.material:material:1.13.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
