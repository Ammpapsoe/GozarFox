plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // HTTP client (Stage 1 of the standard-library migration; replaces the
    // hand-rolled HttpURLConnection plumbing in FoxNet/FoxRelay/FoxShield).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // DNS message codec for the in-tunnel resolver (Stage 1; replaces the
    // hand-rolled packet parsing kept only for TTL patching).
    implementation 'dnsjava:dnsjava:3.7.1'
    // Netty 4.1, not 4.2: 4.2 shades invoke-polymorphic VarHandle method
    // handles (shaded jctools queues), which D8 cannot desugar below
    // min-api 26. The Android app ships minSdk 24, so the APK must use
    // 4.1.x, whose class files contain no signature-polymorphic call sites
    // (verified by constant-pool scan of every netty 4.1.140 artifact).
    implementation 'io.netty:netty-codec-http2:4.1.140.Final'
    implementation 'io.netty:netty-handler-proxy:4.1.140.Final'
    implementation 'io.netty:netty-handler:4.1.140.Final'
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

// CI-only, opt-in diagnostic; never shipped in Android or release artifacts.
tasks.register('warpLiveProbeJar', Jar) {
    dependsOn tasks.testClasses
    archiveFileName = 'gozar-kotlin-warp-live.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.gozar.FoxWarpLiveProbe' }
    from sourceSets.main.output
    from sourceSets.test.output
    from { configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**'
}
