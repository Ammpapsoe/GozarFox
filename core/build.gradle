plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Stateful RFC 7541 response decoding for the dedicated UDP HTTP/2 pool.
    // Its published POM lists test libraries as runtime dependencies; none are needed.
    implementation('com.twitter:hpack:1.0.2') { transitive = false }
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

// CI-only, opt-in diagnostic; never shipped in Android or release artifacts.
tasks.register('warpLiveProbeJar', Jar) {
    dependsOn tasks.testClasses
    archiveFileName = 'gozar-kotlin-warp-live.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.gozar.FoxWarpLiveProbe' }
    from sourceSets.main.output
    from sourceSets.test.output
    from { configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**'
}
