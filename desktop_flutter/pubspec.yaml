name: gozar
description: Gozar desktop
publish_to: 'none'
version: 1.18.2+68

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  window_manager: ^0.5.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/firefox.png
    - assets/windscribe/connection-badge/
    - assets/windscribe/network/
    - assets/windscribe/emergencyconnect/
    - assets/windscribe/pingbar/
    - assets/windscribe/update/
    - assets/windscribe/LICENSE-WINDSCRIBE.txt
    - assets/gozar.png
    - assets/flags/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
