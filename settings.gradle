pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Liquid glass surfaces ship as an AAR with prebuilt native blur
        // kernels; it is not on Maven Central or Google's repository.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "Gozar"
include ':app'
include ':core'
